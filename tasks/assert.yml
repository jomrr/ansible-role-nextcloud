---
# role: nextcloud
# file: tasks/assert.yml

- name: NEXTCLOUD | Inspect configuration in the application directory
  become: true
  become_user: root
  ansible.builtin.stat:
    path: "{{ nextcloud_install_dir }}/config/config.php"
    get_checksum: false
  register: __nextcloud_embedded_config

- name: NEXTCLOUD | Validate deployment paths and public endpoint
  ansible.builtin.assert:
    that:
      - not __nextcloud_embedded_config.stat.exists
      - nextcloud_install_dir is match('^/[^%\\s]+$')
      - nextcloud_install_dir == nextcloud_install_dir | ansible.builtin.normpath
      - nextcloud_data_dir is match('^/[^%\\s]+$')
      - nextcloud_data_dir == nextcloud_data_dir | ansible.builtin.normpath
      - nextcloud_data_dir != nextcloud_install_dir
      - not nextcloud_data_dir.startswith(nextcloud_install_dir + '/')
      - not nextcloud_install_dir.startswith(nextcloud_data_dir + '/')
      - nextcloud_config_dir is match('^/[^%\\s]+$')
      - nextcloud_config_dir == nextcloud_config_dir | ansible.builtin.normpath
      - nextcloud_config_dir != nextcloud_install_dir
      - not nextcloud_config_dir.startswith(nextcloud_install_dir + '/')
      - not nextcloud_install_dir.startswith(nextcloud_config_dir + '/')
      - nextcloud_config_dir != nextcloud_data_dir
      - not nextcloud_config_dir.startswith(nextcloud_data_dir + '/')
      - not nextcloud_data_dir.startswith(nextcloud_config_dir + '/')
      - nextcloud_php_binary is match('^/[^%\\s]+$')
      - nextcloud_url is match('^https://[^/\\s]+(/[^\\s]*)?$')
      - nextcloud_trusted_domains | length > 0
      - >-
        nextcloud_config.keys() | intersect(['installed', 'version', 'instanceid', 'passwordsalt', 'secret',
        'datadirectory', 'dbtype', 'dbhost', 'dbname', 'dbuser', 'dbpassword', 'dbtableprefix',
        'trusted_domains', 'overwrite.cli.url']) | length == 0
    quiet: true
    fail_msg: >-
      Use absolute non-overlapping paths, an HTTPS URL and configuration without bootstrap keys.
      Migrate any configuration in the application directory before using this role with an external configuration directory.

- name: NEXTCLOUD | Validate trusted host entries
  ansible.builtin.assert:
    that:
      - __nextcloud_domain is match('^[^/\\s*]+$')
    quiet: true
    fail_msg: Trusted domains must contain a hostname or IP address, optionally with a port, without wildcards or URL paths.
  loop: "{{ nextcloud_trusted_domains }}"
  loop_control:
    loop_var: __nextcloud_domain
    label: "{{ __nextcloud_domain }}"

- name: NEXTCLOUD | Validate installation passwords for standard input
  ansible.builtin.assert:
    that:
      - nextcloud_database_password | length > 0
      - nextcloud_database_password == nextcloud_database_password | trim
      - "'\n' not in nextcloud_database_password"
      - "'\r' not in nextcloud_database_password"
      - nextcloud_admin_password | length > 0
      - nextcloud_admin_password == nextcloud_admin_password | trim
      - "'\n' not in nextcloud_admin_password"
      - "'\r' not in nextcloud_admin_password"
    quiet: true
    fail_msg: Installation passwords must be nonempty single lines without leading or trailing whitespace.
  no_log: true

- name: NEXTCLOUD | Validate app identifiers
  ansible.builtin.assert:
    that:
      - __nextcloud_app is match('^[a-z][a-z0-9_]*$')
      - nextcloud_apps | unique | length == nextcloud_apps | length
    quiet: true
    fail_msg: Use unique App Store identifiers containing lowercase letters, digits and underscores.
  loop: "{{ nextcloud_apps }}"
  loop_control:
    loop_var: __nextcloud_app
    label: "{{ __nextcloud_app }}"
