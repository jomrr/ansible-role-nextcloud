---
# role: nextcloud
# file: defaults/main.yml

# Absolute directory containing the Nextcloud application.
nextcloud_install_dir: /var/www/nextcloud

# Absolute data directory outside the application document root.
nextcloud_data_dir: /srv/www/nextcloud

# Absolute configuration directory shared by the web runtime, occ and cron.
nextcloud_config_dir: /etc/nextcloud

# Existing PHP runtime account; empty selects the platform account.
nextcloud_user: ''

# Existing PHP runtime group; empty selects the platform group.
nextcloud_group: ''

# Absolute path to the PHP CLI matching the web runtime.
nextcloud_php_binary: /usr/bin/php

# Persistent host-wide SELinux booleans applied only when SELinux is enabled.
nextcloud_sebooleans:
  httpd_unified: false

# Database engine of the prepared database.
# Choices: mysql, pgsql
nextcloud_database_type: mysql

# Database hostname, optionally including a port or local socket.
nextcloud_database_host: localhost

# Name of the prepared, empty database used during initial installation.
nextcloud_database_name: nextcloud

# Account with full privileges on the prepared database.
nextcloud_database_user: nextcloud

# Database password used only during initial installation.
# nextcloud_database_password: supplied_through_ansible_vault

# Administrator account created during initial installation.
nextcloud_admin_user: admin

# Administrator password used only during initial installation.
# nextcloud_admin_password: supplied_through_ansible_vault

# Hostnames or IP addresses accepted by Nextcloud, optionally including ports.
# nextcloud_trusted_domains:
#   - cloud.example.org

# Public HTTPS base URL used for links generated by background jobs.
# nextcloud_url: https://cloud.example.org

# Additional system configuration using JSON-compatible values, including secrets.
nextcloud_config:
  debug: false
# nextcloud_config:
#   default_phone_region: DE
#   maintenance_window_start: 1

# App identifiers to install from the Nextcloud App Store and keep enabled.
nextcloud_apps: []
# nextcloud_apps:
#   - calendar
#   - contacts

# LDAP configuration IDs mapped to user_ldap settings.
nextcloud_ldap: {}

# Policy for writing LDAP bind passwords without comparing stored secrets.
# Choices: on_create, always
nextcloud_ldap_update_password: on_create

# Validate every managed LDAP configuration and its connectivity after configuration.
nextcloud_ldap_test: false

# Administrative external storage mounts identified by their absolute mount point.
nextcloud_external_storages: []

# Remove administrative external mounts omitted from nextcloud_external_storages.
nextcloud_external_storages_purge: false

# App identifiers mapped to configuration keys and values.
nextcloud_app_config: {}
